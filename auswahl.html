<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#5A1A22">
<meta name="robots" content="noindex">
<title>Ihre Auswahl – Bestattungshaus Kallwaß</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="vendor/fonts/schriften.css" rel="stylesheet">
<!--
  Kundenseite: Angehörige blättern durch den Katalog, merken sich mit der Stecknadel,
  was ihnen gefällt, und schicken die Merkliste ab (→ /api/auswahl → Mail an post@).

  Aufruf:  /auswahl.html?fuer=Erika%20Muster            Blumen (Standard)
           /auswahl.html?kategorie=Urnen&fuer=…          andere Kategorie

  Bewusst ohne Firebase-SDK: Die Seite liest den Katalog über die öffentliche
  Firestore-REST-Schnittstelle. Auf dem Handy der Angehörigen lädt sie so in
  einem Bruchteil der Zeit, und mit der Verwaltung hat sie nichts zu tun.
-->
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bordeaux:#5A1A22;--bordeaux-light:#722F37;--bordeaux-dark:#3E0F15;
  --gold:#C5A55A;--gold-light:#D4BA7A;--gold-dark:#A8893E;
  --cream:#FAF7F2;--warm-white:#FEFCF9;--warm-gray:#E8E2DA;
  --text-dark:#2A1A1D;--text-muted:#6B5A5E;--text-light:#9A8A8E;
  --shadow-sm:0 1px 3px rgba(90,26,34,0.08);--shadow-md:0 4px 16px rgba(90,26,34,0.1);
  --shadow-lg:0 8px 32px rgba(90,26,34,0.16);
  --radius:12px;--radius-lg:20px;
  --font-display:'Cormorant Garamond',Georgia,serif;
  --font-body:'Nunito Sans',system-ui,sans-serif;
}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font-body);background:var(--cream);color:var(--text-dark);line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:6rem}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}

header{background:var(--bordeaux);color:var(--cream);text-align:center;padding:2.2rem 1rem 2rem}
header .marke{font-family:var(--font-display);color:var(--gold);letter-spacing:.14em;text-transform:uppercase;font-size:.85rem}
header h1{font-family:var(--font-display);font-weight:400;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.2;margin:.4rem 0}
header .fuer{font-family:var(--font-display);font-style:italic;font-size:1.15rem;color:var(--gold-light)}
header p.hinweis{max-width:34rem;margin:1rem auto 0;font-size:.95rem;color:rgba(250,247,242,.82)}

.gruppen{position:sticky;top:0;z-index:20;background:rgba(250,247,242,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--warm-gray);display:flex;gap:.5rem;overflow-x:auto;padding:.8rem 1rem;scrollbar-width:none}
.gruppen::-webkit-scrollbar{display:none}
.gruppen button{flex:0 0 auto;padding:.45rem 1rem;border-radius:999px;border:1px solid var(--warm-gray);background:var(--warm-white);font-size:.9rem;color:var(--text-muted);white-space:nowrap}
.gruppen button.aktiv{background:var(--bordeaux);border-color:var(--bordeaux);color:var(--cream)}
.gruppen button .zahl{opacity:.6;margin-left:.3rem;font-size:.8rem}

main{max-width:1100px;margin:0 auto;padding:1.2rem 1rem}
.abschnitt h2{font-family:var(--font-display);font-weight:500;color:var(--bordeaux);font-size:1.6rem;margin:1.2rem 0 .8rem}
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem}
.karte{background:var(--warm-white);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);position:relative;transition:box-shadow .2s}
.karte.gemerkt{box-shadow:0 0 0 2px var(--gold),var(--shadow-md)}
.karte .bild{display:block;width:100%;aspect-ratio:1;background:var(--warm-gray)}
.karte .bild img{width:100%;height:100%;object-fit:cover;display:block}
.karte .name{padding:.6rem .75rem .75rem;font-size:.9rem;line-height:1.35;color:var(--text-dark)}
.karte .preis{display:block;color:var(--text-muted);font-size:.82rem;margin-top:.15rem}
.herz{position:absolute;top:.5rem;right:.5rem;width:2.6rem;height:2.6rem;border-radius:50%;background:rgba(254,252,249,.92);box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center}
.herz svg{width:1.3rem;height:1.3rem;fill:none;stroke:var(--bordeaux);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* Am PC zeigt man mit der Maus – dort reicht eine kleinere Nadel. Am Handy bleibt sie
   groß genug für den Daumen. */
@media(hover:hover) and (pointer:fine){
  .herz{width:2rem;height:2rem;top:.45rem;right:.45rem}
  .herz svg{width:1rem;height:1rem}
}
.gemerkt .herz,.herz.an{background:var(--bordeaux)}
.gemerkt .herz svg,.herz.an svg{fill:var(--gold);stroke:var(--gold)}

.leiste{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:.75rem 1rem calc(.75rem + env(safe-area-inset-bottom));background:var(--bordeaux);color:var(--cream);display:flex;align-items:center;justify-content:space-between;gap:1rem;transform:translateY(110%);transition:transform .3s;box-shadow:0 -4px 20px rgba(0,0,0,.15)}
.leiste.sichtbar{transform:none}
.leiste .text{font-size:.95rem}
.leiste .text b{font-family:var(--font-display);font-size:1.3rem;color:var(--gold);font-weight:600}
.knopf{background:var(--gold);color:var(--bordeaux-dark);padding:.7rem 1.3rem;border-radius:999px;font-weight:700;font-size:.95rem;white-space:nowrap}
.knopf:disabled{opacity:.5;cursor:default}
.knopf.leer{background:transparent;border:1px solid var(--warm-gray);color:var(--text-muted)}

.ebene{position:fixed;inset:0;z-index:50;background:rgba(42,26,29,.7);display:none;align-items:flex-end;justify-content:center}
.ebene.offen{display:flex}
.blatt{background:var(--cream);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:1.4rem 1.2rem calc(1.4rem + env(safe-area-inset-bottom))}
@media(min-width:700px){.ebene{align-items:center}.blatt{border-radius:var(--radius-lg)}}
.blatt-kopf{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.blatt h3{font-family:var(--font-display);font-weight:500;font-size:1.6rem;color:var(--bordeaux)}
.zu{width:2.4rem;height:2.4rem;border-radius:50%;background:var(--warm-gray);font-size:1.1rem}
.liste{list-style:none;margin-bottom:1.2rem}
.liste li{padding:.7rem 0;border-bottom:1px solid var(--warm-gray)}
.liste .zeile{display:flex;align-items:center;gap:.8rem}
.schleifen-hinweis{font-size:.85rem;color:var(--text-muted);background:var(--warm-white);border-left:3px solid var(--gold);padding:.5rem .75rem;margin-bottom:.4rem}
.schleifen{margin:.5rem 0 0 calc(56px + .8rem)}
.schleife{background:var(--warm-white);border:1px solid var(--warm-gray);border-radius:10px;padding:.6rem .7rem;margin-bottom:.5rem}
.schleife-kopf{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;font-weight:700;color:var(--bordeaux)}
.schleife-kopf button{font-size:.8rem;font-weight:400;color:var(--text-light);padding:.2rem .3rem}
.schleife textarea{min-height:3.6rem;font-size:.95rem;padding:.5rem .6rem;margin-top:.4rem}
.schleife-neu{font-size:.88rem;font-weight:700;color:var(--bordeaux);border:1px dashed var(--gold);border-radius:999px;padding:.4rem .9rem}
@media(max-width:480px){.schleifen{margin-left:0}}
.liste img{width:56px;height:56px;border-radius:8px;object-fit:cover;flex:0 0 auto;background:var(--warm-gray)}
.liste .wer{flex:1;font-size:.92rem;line-height:1.35}
.liste .wer small{display:block;color:var(--text-light)}
.liste .weg{color:var(--text-light);font-size:.85rem;padding:.4rem}
label{display:block;font-size:.85rem;color:var(--text-muted);margin:.8rem 0 .3rem}
input,textarea{width:100%;font:inherit;font-size:1rem;padding:.7rem .85rem;border:1px solid var(--warm-gray);border-radius:10px;background:var(--warm-white);color:var(--text-dark)}
input:focus,textarea:focus{outline:2px solid var(--gold);border-color:transparent}
textarea{min-height:5rem;resize:vertical}
.falle{position:absolute;left:-9999px}
.fehler{color:#a0302a;font-size:.9rem;margin-top:.8rem;display:none}
.aktionen{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1.2rem;flex-wrap:wrap}
.danke{text-align:center;padding:1.5rem .5rem}
.danke .zeichen{font-size:2.4rem;color:var(--gold)}
.danke p{color:var(--text-muted);margin-top:.6rem}
.uebersicht{border:1px solid var(--warm-gray);border-radius:var(--radius);background:var(--warm-white);padding:1rem;margin-top:1rem}
.ue-kopf{text-align:center;border-bottom:1px solid var(--warm-gray);padding-bottom:.7rem;margin-bottom:.4rem}
.ue-kopf .marke{font-family:var(--font-display);color:var(--gold-dark);letter-spacing:.12em;text-transform:uppercase;font-size:.75rem}
.ue-kopf h3{font-family:var(--font-display);font-weight:500;color:var(--bordeaux);font-size:1.4rem}
.ue-kopf p{font-size:.8rem;color:var(--text-muted)}
.ue-liste{list-style:none}
.ue-liste li{display:flex;gap:.8rem;padding:.6rem 0;border-bottom:1px solid var(--warm-gray);break-inside:avoid}
.ue-liste img{width:72px;height:72px;border-radius:8px;object-fit:cover;flex:0 0 auto}
.ue-liste b{font-weight:600;font-size:.95rem}
.ue-liste small{display:block;color:var(--text-light);font-size:.8rem}
.ue-schleife,.ue-anmerkung{margin-top:.35rem;font-size:.9rem;white-space:pre-wrap;background:var(--cream);border-left:3px solid var(--gold);padding:.3rem .55rem}
.ue-schleife span,.ue-anmerkung span{display:block;font-size:.72rem;color:var(--text-muted);white-space:normal}
.ue-anmerkung{margin-top:.8rem}
.ue-fuss{text-align:center;font-size:.75rem;color:var(--text-light);margin-top:.8rem}
/* Drucken bzw. „Als PDF sichern": nur die Übersicht, ohne Katalog und Knöpfe */
@media print{
  body{padding:0;background:#fff}
  body>*:not(#merkliste){display:none!important}
  #merkliste{position:static;display:block!important;background:none}
  .blatt{max-height:none;overflow:visible;border-radius:0;padding:0;max-width:none}
  .danke,.nicht-drucken{display:none!important}
  .uebersicht{border:0;margin:0}
}

.gross{position:fixed;inset:0;z-index:60;background:rgba(20,10,12,.94);display:none;flex-direction:column;align-items:center;justify-content:center;padding:1rem}
.gross.offen{display:flex}
.gross img{max-width:100%;max-height:72vh;border-radius:var(--radius);object-fit:contain}
.gross .unten{display:flex;align-items:center;gap:1rem;margin-top:1rem;color:var(--cream);max-width:640px;width:100%;justify-content:space-between}
.gross .titel{font-family:var(--font-display);font-size:1.3rem}
.gross .herz{position:static;flex:0 0 auto}
.gross .zu{position:absolute;top:1rem;right:1rem;background:rgba(255,255,255,.15);color:#fff}
.gross .pfeil{position:absolute;top:45%;width:3rem;height:3rem;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:1.4rem}
.gross .pfeil.l{left:.6rem}.gross .pfeil.r{right:.6rem}

.status{text-align:center;color:var(--text-muted);padding:3rem 1rem}
.loader{width:36px;height:36px;border:2px solid var(--warm-gray);border-top-color:var(--gold);border-radius:50%;animation:dreh .8s linear infinite;margin:0 auto 1rem}
@keyframes dreh{to{transform:rotate(360deg)}}
footer{text-align:center;color:var(--text-light);font-size:.82rem;padding:2rem 1rem}
</style>
</head>
<body>

<header>
  <div class="marke">Bestattungshaus Kallwaß</div>
  <h1 id="titel">Blumenauswahl</h1>
  <div class="fuer" id="fuerZeile" hidden></div>
  <p class="hinweis">Nehmen Sie sich Zeit. Tippen Sie auf die Stecknadel bei allem, was Ihnen gefällt – am Ende schicken Sie uns Ihre Merkliste, und wir melden uns bei Ihnen.</p>
</header>

<nav class="gruppen" id="gruppen" aria-label="Arten"></nav>

<main id="inhalt"><div class="status"><div class="loader"></div>Einen Moment …</div></main>

<footer>Bestattungshaus Kallwaß · post@bestattungshaus-kallwass.de</footer>

<div class="leiste" id="leiste">
  <div class="text"><b id="anzahl">0</b> gemerkt</div>
  <button class="knopf" onclick="merklisteOeffnen()">Merkliste ansehen</button>
</div>

<div class="ebene" id="merkliste" onclick="if(event.target===this)merklisteSchliessen()">
  <div class="blatt" id="blatt"></div>
</div>

<div class="gross" id="gross">
  <button class="zu" onclick="grossSchliessen()" aria-label="Schließen">✕</button>
  <button class="pfeil l" onclick="blaettern(-1)" aria-label="Vorheriges">‹</button>
  <button class="pfeil r" onclick="blaettern(1)" aria-label="Nächstes">›</button>
  <img id="grossBild" alt="">
  <div class="unten">
    <div class="titel" id="grossTitel"></div>
    <button class="herz" id="grossHerz" onclick="umschalten(grossId)" aria-label="Merken"></button>
  </div>
</div>

<script>
const API_KEY='AIzaSyDzxxj-kK4eo2RgW-ZQt26cJzHGRs75WbQ';
const BASIS='https://firestore.googleapis.com/v1/projects/beratungsapp-bh-kallwass/databases/(default)/documents/';
const POST='post@bestattungshaus-kallwass.de';
// Merk-Symbol: Stecknadel statt Herz – ein Herz wirkt bei Trauerfloristik unpassend.
const HERZ='<svg viewBox="0 0 24 24"><path d="M12 17v5"/><path d="M5 17h14v-1.8a2 2 0 0 0-1.1-1.8l-1.8-.9a2 2 0 0 1-1.1-1.8V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.7a2 2 0 0 1-1.1 1.8l-1.8.9A2 2 0 0 0 5 15.2z"/></svg>';

const param=new URLSearchParams(location.search);
const KATEGORIE=param.get('kategorie')||'Blumen';
const FUER=(param.get('fuer')||'').trim().slice(0,160);
const SPEICHER='auswahl:'+KATEGORIE+':'+FUER;

let artikel=[],gruppen=[],aktiveGruppe='',grossId=null;
let gemerkt=new Set(laden());

function laden(){try{return JSON.parse(localStorage.getItem(SPEICHER))||[]}catch(e){return[]}}
function sichern(){try{localStorage.setItem(SPEICHER,JSON.stringify([...gemerkt]))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function feld(d,k){const f=d.fields&&d.fields[k];return f?(f.stringValue!=null?f.stringValue:f.arrayValue?(f.arrayValue.values||[]).map(v=>v.stringValue||(v.mapValue&&v.mapValue.fields.name&&v.mapValue.fields.name.stringValue)||''):''):''}

async function alles(sammlung){
  let docs=[],token='';
  do{
    const r=await fetch(BASIS+sammlung+'?pageSize=300&key='+API_KEY+(token?'&pageToken='+encodeURIComponent(token):''));
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();docs=docs.concat(j.documents||[]);token=j.nextPageToken||'';
  }while(token);
  return docs;
}

async function start(){
  document.getElementById('titel').textContent=KATEGORIE==='Blumen'?'Blumenauswahl':KATEGORIE;
  document.title=(KATEGORIE==='Blumen'?'Blumenauswahl':KATEGORIE)+' – Bestattungshaus Kallwaß';
  if(FUER){const z=document.getElementById('fuerZeile');z.textContent='für '+FUER;z.hidden=false}
  try{
    const [kats,prods]=await Promise.all([alles('categories'),alles('products')]);
    const kat=kats.find(d=>feld(d,'name')===KATEGORIE);
    if(!kat)throw new Error('Kategorie fehlt');
    const katId=kat.name.split('/').pop();
    artikel=prods.filter(d=>feld(d,'categoryId')===katId&&feld(d,'imageUrl')).map(d=>({
      id:d.name.split('/').pop(),name:feld(d,'name'),gruppe:feld(d,'subcategory')||'Weitere',
      bild:feld(d,'imageUrl'),preis:feld(d,'price')
    })).sort((a,b)=>a.name.localeCompare(b.name,'de'));
    const reihenfolge=feld(kat,'subcategories')||[];
    gruppen=[...new Set(artikel.map(a=>a.gruppe))].sort((a,b)=>{
      const ia=reihenfolge.indexOf(a),ib=reihenfolge.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)});
    // Gemerktes, das es nicht mehr gibt, still aussortieren
    gemerkt=new Set([...gemerkt].filter(id=>artikel.some(a=>a.id===id)));sichern();
    zeichneGruppen();zeichne();leisteAktualisieren();
  }catch(e){
    document.getElementById('inhalt').innerHTML='<div class="status">Die Auswahl konnte gerade nicht geladen werden.<br>Bitte versuchen Sie es in einem Moment noch einmal.</div>';
  }
}

function zeichneGruppen(){
  const nav=document.getElementById('gruppen');
  if(gruppen.length<2){nav.style.display='none';return}
  nav.innerHTML=['',...gruppen].map(g=>{
    const n=g?artikel.filter(a=>a.gruppe===g).length:artikel.length;
    return '<button class="'+(g===aktiveGruppe?'aktiv':'')+'" onclick="waehle(\''+esc(g).replace(/'/g,"\\'")+'\')">'+(g?esc(g):'Alle')+'<span class="zahl">'+n+'</span></button>'}).join('');
}
/* Nach oben zum Anfang der Liste. Nicht offsetTop der Reiterleiste nehmen: Die klebt
   oben fest, ihr offsetTop ist dann die aktuelle Scrollhöhe – und die Seite bliebe stehen. */
function waehle(g){
  aktiveGruppe=g;zeichneGruppen();zeichne();
  const listenAnfang=document.querySelector('header').offsetHeight;
  // Sofort springen statt sanft scrollen: Das sanfte Scrollen bricht ab, sobald die
  // neue (kürzere) Liste und ihre Bilder das Seitenlayout verändern.
  if(window.scrollY>listenAnfang)window.scrollTo(0,listenAnfang);
}

function sichtbare(){return artikel.filter(a=>!aktiveGruppe||a.gruppe===aktiveGruppe)}
function karte(a){
  return '<div class="karte'+(gemerkt.has(a.id)?' gemerkt':'')+'" id="k_'+a.id+'">'+
    '<button class="bild" onclick="grossOeffnen(\''+a.id+'\')" aria-label="'+esc(a.name)+' groß ansehen"><img src="'+esc(a.bild)+'" alt="" loading="lazy"></button>'+
    '<button class="herz" onclick="umschalten(\''+a.id+'\')" aria-label="Merken">'+HERZ+'</button>'+
    '<div class="name">'+esc(a.name)+(a.preis?'<span class="preis">'+esc(a.preis)+'</span>':'')+'</div></div>';
}
function zeichne(){
  const ziel=document.getElementById('inhalt');
  if(!artikel.length){ziel.innerHTML='<div class="status">Hier ist noch nichts hinterlegt.</div>';return}
  const liste=aktiveGruppe?[aktiveGruppe]:gruppen;
  ziel.innerHTML=liste.map(g=>'<section class="abschnitt">'+(gruppen.length>1?'<h2>'+esc(g)+'</h2>':'')+
    '<div class="raster">'+artikel.filter(a=>a.gruppe===g).map(karte).join('')+'</div></section>').join('');
}

function umschalten(id){
  if(gemerkt.has(id))gemerkt.delete(id);else gemerkt.add(id);
  sichern();
  const k=document.getElementById('k_'+id);if(k)k.classList.toggle('gemerkt',gemerkt.has(id));
  if(grossId===id)grossHerz();
  leisteAktualisieren();
  if(document.getElementById('merkliste').classList.contains('offen'))zeichneMerkliste();
}
function leisteAktualisieren(){
  document.getElementById('anzahl').textContent=gemerkt.size;
  document.getElementById('leiste').classList.toggle('sichtbar',gemerkt.size>0);
}

/* --- Großansicht --- */
function grossOeffnen(id){grossId=id;grossZeigen();document.getElementById('gross').classList.add('offen');document.body.style.overflow='hidden'}
function grossSchliessen(){document.getElementById('gross').classList.remove('offen');document.body.style.overflow='';grossId=null}
function grossZeigen(){
  const a=artikel.find(x=>x.id===grossId);if(!a)return;
  document.getElementById('grossBild').src=a.bild;
  document.getElementById('grossTitel').textContent=a.name+(a.preis?' · '+a.preis:'');
  grossHerz();
}
function grossHerz(){const h=document.getElementById('grossHerz');h.innerHTML=HERZ;h.classList.toggle('an',gemerkt.has(grossId))}
function blaettern(r){const l=sichtbare();if(!l.length)return;let i=l.findIndex(a=>a.id===grossId);i=(i+r+l.length)%l.length;grossId=l[i].id;grossZeigen()}
document.addEventListener('keydown',e=>{
  if(!grossId)return;if(e.key==='Escape')grossSchliessen();if(e.key==='ArrowLeft')blaettern(-1);if(e.key==='ArrowRight')blaettern(1)});
let wischX=null;
document.getElementById('gross').addEventListener('touchstart',e=>{wischX=e.touches[0].clientX},{passive:true});
document.getElementById('gross').addEventListener('touchend',e=>{if(wischX==null)return;const d=e.changedTouches[0].clientX-wischX;if(Math.abs(d)>50)blaettern(d<0?1:-1);wischX=null});

/* --- Schleifen je Artikel ---
   Angehörige tragen den Schleifentext selbst ein, so kommt die Schreibweise der Namen
   genau so bei uns an. Je Schleife ein Textfeld – wie viele Schleifen, gibt die Familie vor.
   Ob überhaupt eine Schleife dran soll, entscheidet die Familie selbst über den Knopf;
   vorher steht kein leeres Feld da, das wie eine Pflichtangabe wirkt. */
const MAX_SCHLEIFEN=8;   // große Gestecke haben bis zu 6 Schleifen, etwas Luft nach oben
let schleifen={};
try{schleifen=JSON.parse(localStorage.getItem(SPEICHER+':schleifen2'))||{}}catch(e){}
function schleifenSichern(){try{localStorage.setItem(SPEICHER+':schleifen2',JSON.stringify(schleifen))}catch(e){}}
function schleifenVon(a){
  if(!schleifen[a.id])schleifen[a.id]=[];
  return schleifen[a.id];
}
function schleifeHinzu(id){entwurfMerken();const a=artikel.find(x=>x.id===id);const l=schleifenVon(a);if(l.length<MAX_SCHLEIFEN)l.push({text:''});schleifenSichern();zeichneMerkliste()}
function schleifeWeg(id,i){entwurfMerken();schleifen[id].splice(i,1);schleifenSichern();zeichneMerkliste()}
function schleifeText(feld){schleifen[feld.dataset.id][+feld.dataset.i].text=feld.value;schleifenSichern()}
function schleifenHtml(a){
  const l=schleifenVon(a);
  return '<div class="schleifen">'+l.map((s,i)=>
    '<div class="schleife"><div class="schleife-kopf">Schleife '+(i+1)+'<button type="button" onclick="schleifeWeg(\''+a.id+'\','+i+')">entfernen</button></div>'+
    '<textarea rows="2" data-id="'+a.id+'" data-i="'+i+'" oninput="schleifeText(this)" placeholder="z. B. In stiller Trauer – Deine Kinder Anna und Paul">'+esc(s.text||'')+'</textarea>'+
    '</div>').join('')+
    (l.length<MAX_SCHLEIFEN?'<button type="button" class="schleife-neu" onclick="schleifeHinzu(\''+a.id+'\')">+ '+(l.length?'Weitere Schleife':'Schleife')+' hinzufügen</button>':'')+
  '</div>';
}
/* Nur ausgefüllte Schleifen der gemerkten Artikel mitschicken. */
function schleifenZumSenden(){
  const aus={};
  [...gemerkt].forEach(id=>{const l=(schleifen[id]||[]).filter(s=>(s.text||'').trim());if(l.length)aus[id]=l});
  return aus;
}

/* --- Merkliste und Absenden --- */
let entwurf={name:'',kontakt:'',fuer:FUER,anmerkung:''};
function merklisteOeffnen(){zeichneMerkliste();document.getElementById('merkliste').classList.add('offen');document.body.style.overflow='hidden'}
function merklisteSchliessen(){entwurfMerken();document.getElementById('merkliste').classList.remove('offen');document.body.style.overflow=''}
function entwurfMerken(){['name','kontakt','fuer','anmerkung'].forEach(k=>{const f=document.getElementById('f_'+k);if(f)entwurf[k]=f.value})}
function zeichneMerkliste(){
  entwurfMerken();
  const liste=artikel.filter(a=>gemerkt.has(a.id));
  document.getElementById('blatt').innerHTML=
    '<div class="blatt-kopf"><h3>Ihre Merkliste</h3><button class="zu" onclick="merklisteSchliessen()" aria-label="Schließen">✕</button></div>'+
    (liste.length?'<p class="schleifen-hinweis">Soll eine Schleife dazu? Dann auf „Schleife hinzufügen“ tippen und den Text genau so schreiben, wie er auf der Schleife stehen soll – auch die Namen.</p>'+
      '<ul class="liste">'+liste.map(a=>'<li><div class="zeile"><img src="'+esc(a.bild)+'" alt=""><div class="wer">'+esc(a.name)+'<small>'+esc(a.gruppe)+(a.preis?' · '+esc(a.preis):'')+'</small></div><button class="weg" onclick="umschalten(\''+a.id+'\')">Entfernen</button></div>'+schleifenHtml(a)+'</li>').join('')+'</ul>'
      :'<p style="color:var(--text-muted);margin-bottom:1rem">Noch nichts gemerkt. Tippen Sie auf die Stecknadel bei einem Bild.</p>')+
    '<form onsubmit="absenden(event)">'+
      '<label for="f_name">Ihr Name *</label><input id="f_name" autocomplete="name" required value="'+esc(entwurf.name)+'">'+
      '<label for="f_kontakt">Telefon oder E-Mail *</label><input id="f_kontakt" autocomplete="email" required value="'+esc(entwurf.kontakt)+'">'+
      '<label for="f_fuer">Für (Name der/des Verstorbenen)</label><input id="f_fuer" value="'+esc(entwurf.fuer)+'">'+
      '<label for="f_anmerkung">Anmerkung, Wünsche, Farben …</label><textarea id="f_anmerkung">'+esc(entwurf.anmerkung)+'</textarea>'+
      '<input class="falle" id="f_website" tabindex="-1" autocomplete="off" aria-hidden="true">'+
      '<div class="fehler" id="fehler"></div>'+
      '<div class="aktionen"><button type="button" class="knopf leer" onclick="merklisteSchliessen()">Weiter ansehen</button>'+
      '<button type="submit" class="knopf" id="senden"'+(liste.length?'':' disabled')+'>Auswahl senden</button></div>'+
    '</form>';
}

function mailText(){
  const liste=artikel.filter(a=>gemerkt.has(a.id));
  return 'Guten Tag,\n\nhier ist unsere Auswahl'+(entwurf.fuer?' für '+entwurf.fuer:'')+':\n\n'+
    liste.map((a,i)=>(i+1)+'. '+a.name+' ('+a.gruppe+')'+(schleifenZumSenden()[a.id]||[]).map((s,j)=>
      '\n   Schleife '+(j+1)+': '+s.text.trim()).join('')).join('\n')+
    (entwurf.anmerkung?'\n\nAnmerkung:\n'+entwurf.anmerkung:'')+
    '\n\n'+entwurf.name+'\n'+entwurf.kontakt;
}

async function absenden(e){
  e.preventDefault();entwurfMerken();
  const knopf=document.getElementById('senden'),fehler=document.getElementById('fehler');
  knopf.disabled=true;knopf.textContent='Wird gesendet …';fehler.style.display='none';
  try{
    const r=await fetch('/api/auswahl',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ids:[...gemerkt],name:entwurf.name,kontakt:entwurf.kontakt,fuer:entwurf.fuer,anmerkung:entwurf.anmerkung,schleifen:schleifenZumSenden(),website:document.getElementById('f_website').value})});
    const j=await r.json().catch(()=>({}));
    if(r.ok&&j.ok){gesendet();return}
    if(r.status===400)throw Object.assign(new Error(j.error||'Bitte Eingaben prüfen.'),{eingabe:true});
    throw new Error(j.error||'Versand fehlgeschlagen');
  }catch(err){
    knopf.disabled=false;knopf.textContent='Auswahl senden';
    fehler.style.display='block';
    if(err.eingabe){fehler.textContent=err.message;return}
    // Ausweg, wenn der Server nicht verschicken kann: das eigene Mail-Programm
    const link='mailto:'+POST+'?subject='+encodeURIComponent('Unsere Auswahl'+(entwurf.fuer?' für '+entwurf.fuer:''))+'&body='+encodeURIComponent(mailText());
    fehler.innerHTML='Das Senden hat gerade nicht geklappt. Sie können uns die Auswahl auch über Ihr Mail-Programm schicken: <a href="'+esc(link)+'">E-Mail öffnen</a>';
  }
}
/* Nach dem Absenden bekommt die Familie eine Übersicht dessen, was bei uns angekommen ist –
   zum Abspeichern als PDF oder Ausdrucken. Gebaut wird sie, bevor die Merkliste geleert wird. */
function uebersichtHtml(){
  const liste=artikel.filter(a=>gemerkt.has(a.id)), sch=schleifenZumSenden();
  const datum=new Date().toLocaleString('de-DE',{dateStyle:'long',timeStyle:'short'});
  return '<div class="uebersicht">'+
    '<div class="ue-kopf"><div class="marke">Bestattungshaus Kallwaß</div><h3>Ihre Auswahl'+(entwurf.fuer?' für '+esc(entwurf.fuer):'')+'</h3>'+
    '<p>Gesendet am '+esc(datum)+' von '+esc(entwurf.name)+' · '+esc(entwurf.kontakt)+'</p></div>'+
    '<ul class="ue-liste">'+liste.map(a=>'<li><img src="'+esc(a.bild)+'" alt=""><div><b>'+esc(a.name)+'</b><small>'+esc(a.gruppe)+'</small>'+
      (sch[a.id]||[]).map((s,j)=>'<div class="ue-schleife"><span>Schleife '+(j+1)+'</span>'+esc(s.text.trim())+'</div>').join('')+
    '</div></li>').join('')+'</ul>'+
    (entwurf.anmerkung?'<div class="ue-anmerkung"><span>Anmerkung</span>'+esc(entwurf.anmerkung)+'</div>':'')+
    '<p class="ue-fuss">Bestattungshaus Kallwaß · '+POST+'</p></div>';
}
function gesendet(){
  const uebersicht=uebersichtHtml();
  gemerkt.clear();sichern();schleifen={};schleifenSichern();leisteAktualisieren();
  document.querySelectorAll('.karte.gemerkt').forEach(k=>k.classList.remove('gemerkt'));
  document.getElementById('blatt').innerHTML='<div class="danke"><div class="zeichen">✓</div><h3>Vielen Dank</h3>'+
    '<p>Ihre Auswahl ist bei uns angekommen. Wir melden uns bei Ihnen.</p></div>'+
    uebersicht+
    '<div class="aktionen nicht-drucken" style="justify-content:center"><button class="knopf leer" onclick="merklisteSchliessen()">Schließen</button>'+
    '<button class="knopf" onclick="window.print()">Übersicht speichern</button></div>';
}

start();
</script>
